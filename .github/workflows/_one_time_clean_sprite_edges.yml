name: One-time remove sprite edge artifacts
on:
  push:
    paths:
      - .github/workflows/_one_time_clean_sprite_edges.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image tools
        run: python3 -m pip install --break-system-packages Pillow numpy opencv-python-headless
      - name: Clean detached image artifacts
        run: python3 scripts/_clean_sprite_edges.py
      - name: Verify alpha, dimensions and aspect preservation
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          cases={
          'web/assets/buildings/ruko-01/colors/ground-kopdes.webp':(984,457),
          'web/assets/props/mobil-sppg.webp':(960,500),
          'web/assets/props/mobil-sppg-damaged.webp':(960,500),
          'web/assets/props/mobil-sppg-wreck.webp':(960,500)
          }
          for p,size in cases.items():
              with Image.open(p) as im:
                  assert im.size==size,(p,im.size)
                  assert 'A' in im.getbands(),(p,im.getbands())
                  assert im.getchannel('A').getextrema()[0]==0
                  print('PASS',p,size)
          PY
      - name: Commit edited sprites and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- scripts/_clean_sprite_edges.py .github/workflows/_one_time_clean_sprite_edges.yml
          git add web/assets/buildings/ruko-01/colors/ground-kopdes.webp web/assets/props/mobil-sppg.webp web/assets/props/mobil-sppg-damaged.webp web/assets/props/mobil-sppg-wreck.webp
          git commit -m "fix(assets): clean stray pixels around storefront and delivery trucks"
          git push origin HEAD:main
