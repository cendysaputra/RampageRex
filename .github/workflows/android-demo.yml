name: Android demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - 'mobile/**'
      - '.github/workflows/android-demo.yml'

concurrency:
  group: android-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Salin game ke proyek Android
      - name: Sinkron Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      # Build APK ringan
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../RampageRex-demo.apk
          ls -l ../../RampageRex-demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RampageRex-demo
          path: RampageRex-demo.apk
          retention-days: 30

  # Uji buka di emulator
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RampageRex-demo

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r RampageRex-demo.apk
            adb logcat -c
            adb shell am start -n com.cendysaputra.rampagerex/.MainActivity
            sleep 25
            echo "== proses ==" && (adb shell pidof com.cendysaputra.rampagerex || echo "TIDAK BERJALAN")
            echo "== aktivitas ==" && adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
            echo "== crash ==" && (adb logcat -d -b crash || true)
            echo "== error ==" && (adb logcat -d '*:E' | grep -iE "rampagerex|capacitor|chromium|AndroidRuntime|FATAL" | tail -60 || true)
            echo "== konsol web ==" && (adb logcat -d | grep -iE "Capacitor/Console|chromium.*CONSOLE" | tail -40 || true)
            adb exec-out screencap -p > layar.png
            adb shell pidof com.cendysaputra.rampagerex

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layar-emulator
          path: layar.png
