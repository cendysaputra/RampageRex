name: Android demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - 'mobile/**'
      - '.github/workflows/android-demo.yml'

concurrency:
  group: android-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Salin game ke proyek Android
      - name: Sinkron Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      # Build APK debug
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../RampageRex-demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RampageRex-demo
          path: RampageRex-demo.apk
          retention-days: 30
