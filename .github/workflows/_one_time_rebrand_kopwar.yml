name: One-time Kopwar branding asset update
on:
  push:
    paths:
      - .github/workflows/_one_time_rebrand_kopwar.yml
permissions:
  contents: write
jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install image packages
        run: |
          python3 -m pip install --break-system-packages Pillow numpy opencv-python-headless
      - name: Modify only existing branding pixels
        run: python3 scripts/_rebrand_kopwar_assets.py
      - name: Check image dimensions, transparency and branding outputs
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          expected={
              'web/assets/buildings/ruko-01/colors/ground-kopdes.webp':(984,457),
              'web/assets/props/mobil-sppg.webp':(960,500),
              'web/assets/props/mobil-sppg-damaged.webp':(960,500),
              'web/assets/props/mobil-sppg-wreck.webp':(960,500)
          }
          for path,size in expected.items():
              with Image.open(path) as image:
                  assert image.size==size, (path,image.size)
                  assert 'A' in image.getbands(), (path,image.getbands())
                  print(path,image.size)
          PY
      - name: Commit images, remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- scripts/_rebrand_kopwar_assets.py .github/workflows/_one_time_rebrand_kopwar.yml
          git add web/assets/buildings/ruko-01/colors/ground-kopdes.webp web/assets/props/mobil-sppg.webp web/assets/props/mobil-sppg-damaged.webp web/assets/props/mobil-sppg-wreck.webp
          git commit -m "art: rebrand Kopwar and Dapur Kenyang asset sprites"
          git push origin HEAD:main
