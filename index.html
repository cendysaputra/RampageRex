<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101e1c"><title>Rampage Rex: Ruko Senja</title>
<link rel="icon" href="./assets/ui/hud/frames/rage.png"><link rel="preload" href="./assets/fonts/bangers.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="game">
  <canvas id="world" width="1920" height="1080" aria-label="Arena permainan Rampage Rex"></canvas>
  <section id="menu" aria-labelledby="title">
    <div class="poster" aria-hidden="true"><div class="skyline"></div><div class="shops"></div><img class="cover-rex" src="./assets/characters/rex/master.webp" width="1728" height="910" fetchpriority="high" decoding="async" alt=""><div class="poster-shade"></div></div>
    <div class="menu-top"><button class="audio" aria-pressed="true">Suara: nyala</button></div>
    <div class="menu-body"><h1 id="title">Rampage <em>Rex</em></h1>
    <p class="intro">Kamu jadi Rex. Hancurkan empat distrik kota dan hadapi para penjaganya.</p>
    <div class="buttons"><button class="primary" id="start">Mulai main</button><button class="secondary" id="help">Cara main</button></div>
    <p id="load-status" role="status"></p></div>
    <div class="menu-bottom"><span>Jalan Ruko, Pusat Kota, Pelabuhan, Alun-Alun</span><span id="record"></span></div>
  </section>
  <div id="hud" hidden>
    <div class="hud-top"><div class="player-card"><div class="hud-heading"><strong>REX</strong><span id="hp-text"></span></div><div class="meter"><i id="hp"></i></div><div class="rage-row"><strong>Rage</strong><div class="meter"><i id="rage"></i></div><span id="rage-text"></span></div></div>
    <div class="district-card"><span id="district"></span><b id="destruction"></b><small id="objective"></small></div><button id="pause" aria-label="Jeda"><span aria-hidden="true" class="pause-icon"></span></button></div>
    <div id="bosses"></div><div id="notice" role="status"></div>
    <div id="touch"><div class="pad"><button data-action="left" aria-label="Kiri">◀</button><button data-action="right" aria-label="Kanan">▶</button></div><div class="pad actions"><button data-action="bite" data-skill="bite">Gigit</button><button data-action="tail" data-skill="tail">Ekor</button><button data-action="stomp" data-skill="stomp">Injak</button><button data-action="roar" data-skill="roar">Raung</button><button data-action="ulti" data-skill="ulti" class="ulti">Ulti</button></div></div>
    <div class="key-strip"><span><kbd>A D</kbd> Jalan</span><span data-skill="bite"><kbd>W / Klik kiri</kbd> Gigit</span><span data-skill="tail"><kbd>Q / Klik kanan</kbd> Ekor</span><span data-skill="stomp"><kbd>S</kbd> Injak</span><span data-skill="roar"><kbd>E</kbd> Raung</span><span data-skill="ulti" class="ulti"><kbd>R</kbd> Ulti</span></div>
  </div>
  <dialog id="panel"><div class="panel-inner"><h2 id="panel-title"></h2><div id="panel-copy"></div><div class="buttons" id="panel-actions"></div></div></dialog>
  <noscript>Aktifkan JavaScript untuk memainkan Rampage Rex.</noscript>
</main>
<script type="module" src="./src/main.js"></script>
</body></html>
